# immune-attend — T2+T3: hypothesis-graph fan-out + legibility synthesis.
#
# Fires only when label `immune:t1-pass` is added (by immune-filter or by
# a maintainer). The invariant is enforced by the workflow `if:` condition,
# not by this action — so attend NEVER attends to pre-filtered PRs.
#
# Runtime is a HEADLESS AGENT CLI (claude | codex | gemini), not a Python
# SDK — no pip install, no third-party imports in the immune.py call site.
# Three CLIs are pre-wired because they're the popular drop-ins; if you
# want a different one, edit the install step.
#
# Output: replaces immune:t1-pass with one of:
#   immune:trusted     → maintainer fast-lane
#   immune:suspect     → read carefully
#   immune:needs-human → escalation (e.g. attestation tampered)

name: 'immune-attend'
description: 'T2+T3 of the immune pipeline. Fans out K=3 hypothesis perturbations via a headless agent CLI, then synthesizes a verdict (immune:trusted | immune:suspect | immune:needs-human).'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  agent:
    description: 'claude | codex | gemini. Blank = auto-detect from credentials.'
    required: false
    default: ''
  hg-fanout:
    description: 'How many hypothesis perturbations to spawn in parallel. 0 disables HG generation.'
    required: false
    default: '3'
  replay:
    description: 'Run T3 test replay in sandbox. `false` (default) skips. `true` runs the documented test_cmd.'
    required: false
    default: 'false'

  # ---- claude (Anthropic family) ----
  anthropic-api-key:
    required: false
  use-vertex:
    description: 'Set to "1" to route claude CLI through Google Vertex AI.'
    required: false
    default: ''
  use-bedrock:
    description: 'Set to "1" to route claude CLI through AWS Bedrock.'
    required: false
    default: ''
  google-application-credentials:
    description: 'For Vertex: path to a service-account JSON file, OR raw JSON content (will be written to a temp file).'
    required: false
  vertexai-project:
    required: false
  vertexai-location:
    required: false
    default: 'us-east5'
  aws-access-key-id:
    required: false
  aws-secret-access-key:
    required: false
  aws-session-token:
    required: false
  aws-region:
    required: false
    default: 'us-east-1'

  # ---- codex (OpenAI family) ----
  openai-api-key:
    required: false

  # ---- gemini (Google) ----
  gemini-api-key:
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node (for headless agent CLIs)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install the chosen agent CLI
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
      run: |
        set -euo pipefail
        # Auto-detect if not pinned. Mirrors immune.py:_agent().
        if [ -z "${AGENT}" ]; then
          if [ -n "${{ inputs.openai-api-key }}" ]; then AGENT=codex
          elif [ -n "${{ inputs.gemini-api-key }}" ]; then AGENT=gemini
          else AGENT=claude
          fi
        fi
        echo "IMMUNE_AGENT=$AGENT" >> "$GITHUB_ENV"

        case "$AGENT" in
          claude) npm install -g @anthropic-ai/claude-code ;;
          codex)  npm install -g @openai/codex ;;
          gemini) npm install -g @google/gemini-cli ;;
          *) echo "unknown agent: $AGENT" >&2; exit 1 ;;
        esac

    - name: Materialize Vertex credentials (if inline JSON)
      if: inputs.google-application-credentials != ''
      shell: bash
      env:
        GAC_INPUT: ${{ inputs.google-application-credentials }}
      run: |
        set -euo pipefail
        if [ "${GAC_INPUT:0:1}" = "{" ]; then
          TMP="$RUNNER_TEMP/gcp-sa.json"
          printf '%s' "$GAC_INPUT" > "$TMP"
          chmod 600 "$TMP"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$TMP" >> "$GITHUB_ENV"
        else
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GAC_INPUT" >> "$GITHUB_ENV"
        fi

    - name: Run immune attend
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IMMUNE_HG_FANOUT: ${{ inputs.hg-fanout }}
        IMMUNE_REPLAY: ${{ inputs.replay }}

        # claude family
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_USE_VERTEX: ${{ inputs.use-vertex }}
        CLAUDE_CODE_USE_BEDROCK: ${{ inputs.use-bedrock }}
        ANTHROPIC_VERTEX_PROJECT_ID: ${{ inputs.vertexai-project }}
        CLOUD_ML_REGION: ${{ inputs.vertexai-location }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ inputs.aws-session-token }}
        AWS_REGION: ${{ inputs.aws-region }}

        # codex
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}

        # gemini
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}

        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        SCRIPT="${{ github.action_path }}/../immune.py"

        # The workflow `if:` (needs.filter.outputs.verdict == 'pass') is the
        # primary gate. No defensive label check — labels are no longer the
        # state mechanism, the job-needs-job dependency is.

        python "$SCRIPT" attend "${REPO}#${PR_NUMBER}" --format json > /tmp/immune-attend.json 2> /tmp/immune-attend.err || true
        if [ ! -s /tmp/immune-attend.json ]; then
          echo "::error::immune-attend: empty JSON output (python crashed)"
          echo "--- stderr ---"
          cat /tmp/immune-attend.err 2>&1 || true
          echo "--- end stderr ---"
          exit 1
        fi
        VERDICT=$(python -c 'import json; print(json.load(open("/tmp/immune-attend.json"))["verdict"])')
        python "$SCRIPT" attend "${REPO}#${PR_NUMBER}" --format markdown > /tmp/immune-attend.md 2>> /tmp/immune-attend.err || true

        # Update or post the synthesis comment
        EXISTING=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq '.[] | select(.body | startswith("### immune attend")) | .id' 2>/dev/null | head -1 || true)
        if [ -n "$EXISTING" ]; then
          gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH -F body=@/tmp/immune-attend.md > /dev/null
        else
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@/tmp/immune-attend.md > /dev/null
        fi

        # Strip any stale immune:* labels then apply the terminal verdict.
        # awk (not grep) so a no-match case doesn't fail under set -o pipefail.
        gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name' 2>/dev/null \
          | awk '/^immune:/' | while read -r l; do
              gh api "repos/${REPO}/issues/${PR_NUMBER}/labels/$(printf '%s' "$l" | jq -sRr @uri)" -X DELETE > /dev/null 2>&1 || true
            done

        case "$VERDICT" in
          reasoned)    LABEL="immune:reasoned"    ;;
          no-receipts) LABEL="immune:no-receipts" ;;
          *)           LABEL="immune:no-receipts" ;;
        esac
        gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" -f "labels[]=${LABEL}" > /dev/null 2>&1 || true

        echo "immune-attend: ${VERDICT} → ${LABEL} (agent=${IMMUNE_AGENT}, K=${IMMUNE_HG_FANOUT})"
