# Drop in .github/workflows/immune.yml
#
# Two jobs, label-driven dispatch. Filter fires on PR open. Attend fires
# only when filter (or a maintainer) adds immune:t1-pass.
#
# Attend runs a HEADLESS AGENT CLI (claude | codex | gemini), spawned K=3
# times in parallel for the hypothesis-graph fan-out. Pick ONE block.

name: immune
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  filter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: kimjune01/immune/filter@v0
        with:
          mode: advisory  # or `gate` to auto-close on T0/T1 reject

  attend:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'immune:t1-pass'
    runs-on: ubuntu-latest
    steps:
      # ---- claude (Anthropic direct) ----
      - uses: kimjune01/immune/attend@v0
        with:
          agent: claude
          hg-fanout: '3'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      # ---- claude via Vertex AI ----
      # - uses: kimjune01/immune/attend@v0
      #   with:
      #     agent: claude
      #     use-vertex: '1'
      #     google-application-credentials: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      #     vertexai-project: my-gcp-project
      #     vertexai-location: us-east5

      # ---- claude via AWS Bedrock ----
      # - uses: kimjune01/immune/attend@v0
      #   with:
      #     agent: claude
      #     use-bedrock: '1'
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1

      # ---- codex (OpenAI) ----
      # - uses: kimjune01/immune/attend@v0
