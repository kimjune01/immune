# Drop in .github/workflows/immune.yml
#
# One workflow, two jobs:
#   filter (cheap, ~seconds, no LLM) → if it rejects, label immune:reject and stop
#   attend (LLM, ~$0.01-$0.05/PR)    → waits for the maintainer's existing CI to
#                                       finish before spending tokens. Only fires
#                                       when filter passes AND CI is green.
#
# Labels are minimal and TERMINAL only:
#   immune:reject       (filter)
#   immune:trusted      (attend)
#   immune:suspect      (attend)
#   immune:needs-human  (attend)
# State during the run is conveyed by GHA-native check_runs, not labels.
#
# OPTIONAL: to save your CI runner-minutes on filter-rejected spam, add this
# one line to YOUR existing CI workflow's job(s):
#   if: "!contains(github.event.pull_request.labels.*.name, 'immune:reject')"
# Without it, your CI runs in parallel with immune; with it, your CI is gated
# on immune:reject being absent.

name: immune
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - id: run
        uses: kimjune01/immune/filter@v0.3
        with:
          mode: advisory  # `gate` would also auto-close on reject

  attend:
    needs: filter
    if: needs.filter.outputs.verdict == 'pass'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for maintainer CI (transparent ~20-line poll, no external action deps)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          # Poll check-runs on the PR's HEAD commit. Skip our own workflow's
          # checks (otherwise we'd deadlock waiting on ourselves).
          while true; do
            checks=$(gh api --paginate "repos/${REPO}/commits/${PR_SHA}/check-runs")
            pending=$(echo "$checks" | jq --arg w "$THIS_WORKFLOW" '
              [.check_runs[]
                 | select(.name != $w)
                 | select(.name | startswith($w + " /") | not)
                 | select(.status != "completed")
              ] | length')
            failures=$(echo "$checks" | jq --arg w "$THIS_WORKFLOW" '
              [.check_runs[]
                 | select(.name != $w)
                 | select(.name | startswith($w + " /") | not)
                 | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              ] | length')
            if [ "$failures" -gt 0 ]; then
              echo "::notice::Maintainer CI failed/cancelled — attend exits silently (no label change; the red X on CI is enough signal)"
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All maintainer CI checks completed successfully — proceeding to attend"
              break
            fi
            echo "Waiting on $pending pending check(s)..."
            sleep 20
          done

      # ---- claude (Anthropic direct) — change credentials block per `agent:` ----
      - uses: kimjune01/immune/attend@v0.3
        with:
          agent: claude
          hg-fanout: '3'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      # ---- claude via Vertex AI ----
      # - uses: kimjune01/immune/attend@v0.3
      #   with:
